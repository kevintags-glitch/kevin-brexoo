[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "brexoo-collector"
version = "0.1.0"
description = "Brexoo Project Data Collector: approved public project sources into Brexoo."
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "pydantic>=2.7"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
brexoo-collector = "brexoo_collector.cli:main"

[tool.setuptools.packages.find]
include = ["brexoo_collector*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
