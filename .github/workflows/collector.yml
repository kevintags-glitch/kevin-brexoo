name: Project Data Collector

# Collects from Brexoo's approved public sources every 6 hours and sends new or changed projects to
# Brexoo, which matches them to businesses. Run it by hand from the Actions tab to collect one
# source, re-collect from a date, or do a dry run that sends nothing.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      source:
        description: "Source key, e.g. nsw-planning-da (blank = every enabled source)"
        required: false
        default: ""
      since:
        description: "Collect from this date, YYYY-MM-DD (blank = where each source left off)"
        required: false
        default: ""
      dry_run:
        description: "Dry run: fetch and normalise only, send nothing to Brexoo"
        type: boolean
        default: false

concurrency:
  group: collector
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/pyproject.toml
      - run: pip install ./collector
      - name: Collect
        env:
          BREXOO_API_URL: ${{ secrets.BREXOO_API_URL }}
          COLLECTOR_TOKEN: ${{ secrets.COLLECTOR_TOKEN }}
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
          GETS_FEED_URL: ${{ vars.GETS_FEED_URL }}
          SOURCE: ${{ inputs.source }}
          SINCE: ${{ inputs.since }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" != "true" ] && { [ -z "$BREXOO_API_URL" ] || [ -z "$COLLECTOR_TOKEN" ]; }; then
            echo "::notice::The collector isn't configured yet. Add the BREXOO_API_URL and COLLECTOR_TOKEN repository secrets (see collector/README.md)."
            exit 0
          fi
          args=(run)
          if [ -n "$SOURCE" ]; then args+=(--source "$SOURCE"); else args+=(--all); fi
          if [ -n "$SINCE" ]; then args+=(--since "$SINCE"); fi
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          python -m brexoo_collector "${args[@]}"
